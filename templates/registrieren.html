<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <title>Registrieren – Trainings-Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            padding: 40px 20px;
        }

        .auth-card {
            background: linear-gradient(145deg, #13131f, #1a1a2e);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 44px 36px;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FF6B35, #FF2E63, #8B5CF6);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #FF6B35, #FF2E63);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 16px;
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.3);
        }

        .auth-logo h1 {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #FF6B35, #FF2E63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-logo p {
            color: #6b6b80;
            font-size: 14px;
            margin-top: 4px;
        }

        .flash-msg {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .flash-error {
            background: rgba(255, 46, 99, 0.1);
            border: 1px solid rgba(255, 46, 99, 0.2);
            color: #FF2E63;
        }

        .felder-row {
            display: flex;
            gap: 12px;
        }

        .felder-row > div {
            flex: 1;
        }

        .auth-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6b6b80;
        }

        .auth-link a {
            color: #FF6B35;
            text-decoration: none;
            font-weight: 700;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">🏋️</div>
                <h1>Trainings-Tracker</h1>
                <p>Erstelle dein Konto und starte durch</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash-msg flash-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endwith %}

            <form method="POST" action="/registrieren">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Dein Name" required>

                <label for="email" style="margin-top:16px;">E-Mail</label>
                <input type="email" id="email" name="email" placeholder="deine@email.de" required>

                <div class="felder-row" style="margin-top:16px;">
                    <div>
                        <label for="passwort">Passwort</label>
                        <input type="password" id="passwort" name="passwort" placeholder="Mind. 6 Zeichen" required>
                    </div>
                    <div>
                        <label for="passwort2">Wiederholen</label>
                        <input type="password" id="passwort2" name="passwort2" placeholder="Nochmal eingeben" required>
                    </div>
                </div>

                <div class="felder-row" style="margin-top:16px;">
                    <div>
                        <label for="alter">Alter</label>
                        <input type="number" id="alter" name="alter_jahre" placeholder="z.B. 19">
                    </div>
                    <div>
                        <label for="gewicht">Gewicht (kg)</label>
                        <input type="number" step="0.1" id="gewicht" name="gewicht_kg" placeholder="z.B. 75">
                    </div>
                </div>

                <button type="submit" class="btn-primary">Konto erstellen</button>
            </form>

            <div class="auth-link">
                Schon registriert? <a href="/login">Zum Login</a>
            </div>
        </div>
    </div>
</body>
</html>
