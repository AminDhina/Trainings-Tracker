<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil anlegen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        <h1>TRAININGS-TRACKER</h1>
    </div>

    <div class="container">
        <div class="form-card">
            <h1>Willkommen 👋</h1>
            <p>Bitte leg dein Profil an, damit wir deine Kalorien korrekt berechnen können.</p>

            <form method="POST" action="/profil-anlegen">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Dein Name" required>

                <label for="alter">Alter</label>
                <input type="number" id="alter" name="alter_jahre" placeholder="z.B. 19" required>

                <label for="gewicht">Gewicht (kg)</label>
                <input type="number" step="0.1" id="gewicht" name="gewicht_kg" placeholder="z.B. 75.0" required>

                <button type="submit" class="btn-primary">Profil speichern</button>
            </form>
        </div>
    </div>
</body>
</html>
